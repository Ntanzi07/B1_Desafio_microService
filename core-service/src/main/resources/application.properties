spring.application.name=usuario-api-v2

spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

springdoc.swagger-ui.path=/swagger-ui.html

# Integracao com o Ranking Service (outro processo).
# No Docker, a URL usa o nome do servico na rede (ranking:8081); a credencial vem do .env.
ranking.api.url=${RANKING_API_URL:http://localhost:8081}
ranking.api.user=${RANKING_SERVICE_USER:}
ranking.api.password=${RANKING_SERVICE_PASSWORD:}
