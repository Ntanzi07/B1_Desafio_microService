spring.application.name=ranking-service

# Porta diferente do Core (8080): sao dois processos independentes.
server.port=8081

# Banco proprio do Ranking. No Docker, os valores vem do docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ranking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Credencial de servico que pode chamar PUT/DELETE (vem do .env via docker-compose).
# Sem valor padrao de proposito: se a variavel faltar, a aplicacao nem sobe (fail-fast),
# em vez de subir com uma senha conhecida.
ranking.security.user=${RANKING_SERVICE_USER}
ranking.security.password=${RANKING_SERVICE_PASSWORD}

springdoc.swagger-ui.path=/swagger-ui.html

# Origens (sites) que podem ler o ranking pelo navegador. Varias: separadas por virgula.
ranking.cors.allowed-origins=${RANKING_CORS_ALLOWED_ORIGINS:http://localhost:8080}
