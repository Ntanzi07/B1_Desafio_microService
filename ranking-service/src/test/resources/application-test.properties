# Perfil "test": sobrescreve o application.properties principal so durante os testes.
# H2 em memoria no lugar do PostgreSQL: o teste nao depende de container.
spring.datasource.url=jdbc:h2:mem:ranking_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Credencial de servico fixa para o teste (em producao vem do .env).
ranking.security.user=test-service
ranking.security.password=test-pass
ranking.cors.allowed-origins=http://localhost:8080
